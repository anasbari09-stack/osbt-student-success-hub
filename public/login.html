<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Student Success Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <header class="site-header auth-header">
    <nav class="navbar auth-navbar">
      <a class="brand" href="login.html">
        <img src="assets/images/osbt-logo.png" alt="logo OSBT">
        <span>Student Success Hub</span>
      </a>
    </nav>
  </header>

  <main class="page-main login-page">
    <section class="login-panel form-panel" aria-labelledby="loginTitle">
      <p class="eyebrow">Student Success Hub</p>
      <h1 id="loginTitle">Connexion</h1>

      <form id="loginForm">
        <div class="form-row">
          <label for="email">Adresse e-mail</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="form-row">
          <label for="password">Mot de passe</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="button primary-button btn" id="loginButton" type="submit">Se connecter</button>

        <p class="auth-switch">Nouveau ici ? <a href="register.html">Créer un compte</a></p>

        <div class="request-message-area" id="loginMessage" aria-live="polite">
          <p>Les messages de connexion apparaîtront ici.</p>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Student Success Hub. Créé pour le support étudiant.</p>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
